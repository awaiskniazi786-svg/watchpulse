<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Dark Obsidian-Violet Squircle Background -->
    <linearGradient id="wpBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#231845" />
      <stop offset="50%" stop-color="#141122" />
      <stop offset="100%" stop-color="#0B0A12" />
    </linearGradient>

    <!-- Rim Highlight Gradient -->
    <linearGradient id="wpRimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C4B5FD" stop-opacity="0.78" />
      <stop offset="50%" stop-color="#7C3AED" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.4" />
    </linearGradient>

    <!-- Glowing Play Triangle Fill -->
    <linearGradient id="wpPlayGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="55%" stop-color="#EDE9FE" />
      <stop offset="100%" stop-color="#C4B5FD" />
    </linearGradient>

    <!-- Electric Violet-to-Cyan Pulse Wave -->
    <linearGradient id="wpPulseGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="48%" stop-color="#A78BFA" />
      <stop offset="78%" stop-color="#E0E7FF" />
      <stop offset="100%" stop-color="#7DD3FC" />
    </linearGradient>

    <!-- Soft Ambient Glow -->
    <filter id="wpGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded Squircle App Icon Badge -->
  <rect x="20" y="20" width="472" height="472" rx="112" fill="url(#wpBgGrad)" />
  <rect x="20" y="20" width="472" height="472" rx="112" fill="none" stroke="url(#wpRimGrad)" stroke-width="12" />

  <!-- Cinema Play Triangle -->
  <path d="M 164 134 C 164 114, 186 102, 204 112 L 386 218 C 404 228, 404 254, 386 264 L 204 370 C 186 380, 164 368, 164 348 Z"
        fill="url(#wpPlayGrad)" opacity="0.95" />

  <!-- Dark Trench Cutout for Pulse Contrast -->
  <path d="M 88 256 L 178 256 L 206 196 L 244 334 L 284 142 L 320 286 L 344 256 L 424 256"
        fill="none" stroke="#110E1E" stroke-width="44" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Glowing Electric Pulse Wave -->
  <path d="M 88 256 L 178 256 L 206 196 L 244 334 L 284 142 L 320 286 L 344 256 L 424 256"
        fill="none" stroke="url(#wpPulseGrad)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"
        filter="url(#wpGlow)" />
</svg>
