<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Dark Obsidian-Violet Squircle Background -->
    <linearGradient id="wpBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22193F" />
      <stop offset="55%" stop-color="#130F24" />
      <stop offset="100%" stop-color="#0B0914" />
    </linearGradient>

    <!-- Rim Highlight Gradient -->
    <linearGradient id="wpRimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C4B5FD" stop-opacity="0.72" />
      <stop offset="50%" stop-color="#7C3AED" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#4C1D95" stop-opacity="0.55" />
    </linearGradient>

    <!-- Glowing Play Triangle Fill -->
    <linearGradient id="wpPlayGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="55%" stop-color="#EDE9FE" />
      <stop offset="100%" stop-color="#C4B5FD" />
    </linearGradient>

    <!-- Electric Violet-to-Cyan Pulse Wave -->
    <linearGradient id="wpPulseGrad" x1="76" y1="256" x2="436" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="35%" stop-color="#9333EA" />
      <stop offset="65%" stop-color="#A78BFA" />
      <stop offset="100%" stop-color="#BAE6FD" />
    </linearGradient>

    <!-- Soft Ambient Glow -->
    <filter id="wpGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded Squircle App Icon Badge -->
  <rect x="20" y="20" width="472" height="472" rx="112" fill="url(#wpBgGrad)" />
  <rect x="20" y="20" width="472" height="472" rx="112" fill="none" stroke="url(#wpRimGrad)" stroke-width="10" />
  <rect x="34" y="34" width="444" height="444" rx="98" fill="none" stroke="#A78BFA" stroke-opacity="0.22" stroke-width="3" />

  <!-- Cinema Play Triangle -->
  <path d="M 164 132 C 164 112, 186 100, 204 110 L 390 220 C 408 230, 408 256, 390 266 L 204 376 C 186 386, 164 374, 164 354 Z"
        fill="url(#wpPlayGrad)" filter="url(#wpGlow)" />

  <!-- Dark Trench Cutout for Pulse Contrast (Sharp Miter Peaks Matching Option 1) -->
  <path d="M 76 256 L 182 256 L 210 184 L 246 346 L 284 128 L 318 294 L 340 256 L 436 256"
        fill="none" stroke="#130F24" stroke-width="44" stroke-linecap="round" stroke-linejoin="miter" stroke-miterlimit="10" />

  <!-- Full-Length Glowing Electric Pulse Wave (Left Tapered Tip to Right Rounded Tip) -->
  <path d="M 76 256 L 182 256 L 210 184 L 246 346 L 284 128 L 318 294 L 340 256 L 436 256"
        fill="none" stroke="url(#wpPulseGrad)" stroke-width="20" stroke-linecap="round" stroke-linejoin="miter" stroke-miterlimit="10"
        filter="url(#wpGlow)" />
</svg>
