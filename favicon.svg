<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#171d2b" />
      <stop offset="50%" stop-color="#0e131d" />
      <stop offset="100%" stop-color="#070a0f" />
    </linearGradient>

    <!-- Outer Glow Ring -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e50914" />
      <stop offset="50%" stop-color="#ff3d47" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Lightning Pulse Core -->
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff" />
      <stop offset="25%" stop-color="#ffe600" />
      <stop offset="70%" stop-color="#ff1e27" />
      <stop offset="100%" stop-color="#e50914" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Badge with Rounded Squircle (Modern App Icon Standard) -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="url(#ringGrad)" stroke-width="12" opacity="0.85" />

  <!-- Cinema Reel / Film Strip Accent Dots Top & Bottom -->
  <g fill="#38bdf8" opacity="0.3">
    <rect x="70" y="52" width="28" height="20" rx="4" />
    <rect x="130" y="52" width="28" height="20" rx="4" />
    <rect x="190" y="52" width="28" height="20" rx="4" />
    <rect x="250" y="52" width="28" height="20" rx="4" />
    <rect x="310" y="52" width="28" height="20" rx="4" />
    <rect x="370" y="52" width="28" height="20" rx="4" />
    <rect x="420" y="52" width="28" height="20" rx="4" />

    <rect x="70" y="440" width="28" height="20" rx="4" />
    <rect x="130" y="440" width="28" height="20" rx="4" />
    <rect x="190" y="440" width="28" height="20" rx="4" />
    <rect x="250" y="440" width="28" height="20" rx="4" />
    <rect x="310" y="440" width="28" height="20" rx="4" />
    <rect x="370" y="440" width="28" height="20" rx="4" />
    <rect x="420" y="440" width="28" height="20" rx="4" />
  </g>

  <!-- Glowing Cinematic Lightning Bolt Pulse (Option A) -->
  <path d="M 286,88 L 152,272 L 244,272 L 208,424 L 364,236 L 274,236 Z"
        fill="url(#pulseGrad)"
        filter="url(#neonGlow)" />
</svg>

